repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: env -u VIRTUAL_ENV uv run ruff check --fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: env -u VIRTUAL_ENV uv run ruff format
        language: system
        types_or: [python, pyi]

      - id: django-check
        name: django check
        entry: env -u VIRTUAL_ENV uv run python manage.py check
        language: system
        pass_filenames: false
        always_run: true
