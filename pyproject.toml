[project]
name = "animation-messe"
version = "0.1.0"
description = "Gestion de l'animation liturgique paroissiale"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0.3",
    "gunicorn>=23.0.0",
    "psycopg[binary]>=3.2.6",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.11.0",
    "ruff>=0.8.0",
]

[tool.ruff]
extend-exclude = ["chris"]

[tool.ruff.lint]
ignore = ["BLE001", "FLY002", "RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
norecursedirs = ["chris"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
