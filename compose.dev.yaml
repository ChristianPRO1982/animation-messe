services:
  web:
    build:
      context: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env.dev
    ports:
      - "${AM_BIND_PORT:-8000}:8000"
    volumes:
      - .:/app
    networks:
      - default
      - shared_backend
    depends_on:
      - auth_mock

  auth_mock:
    build:
      context: .
    command: python auth_mock/server.py
    env_file:
      - .env.dev
    ports:
      - "${AUTH_MOCK_BIND_PORT:-8001}:8001"
    volumes:
      - .:/app
    networks:
      - default

networks:
  shared_backend:
    external: true
    name: ${SHARED_DB_NETWORK:-pg-carthographie_backend}
